name: build-exe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build game
        run: msbuild src\BeamPrank.csproj /restore /p:Configuration=Release /p:Platform=AnyCPU /v:minimal

      - name: Build installer
        run: msbuild src\Installer\BeamSetup.csproj /restore /p:Configuration=Release /p:Platform=AnyCPU /v:minimal

      - name: Render screens (self-test)
        shell: pwsh
        run: |
          $exe = "src\bin\Release\BeamNG.drive.exe"
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest','shots' -Wait -PassThru -NoNewWindow
          Write-Host "self-test exit code: $($p.ExitCode)"
          if (Test-Path shots\_report.txt) { Get-Content shots\_report.txt }
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }

      - name: Render installer shots
        shell: pwsh
        run: |
          $setup = "src\Installer\bin\Release\BeamNG.drive_Setup.exe"
          $p = Start-Process -FilePath $setup -ArgumentList '--shot','shots' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "installer shot failed with exit code $($p.ExitCode)" }
          foreach ($n in '18-installer-welcome','19-installer-working','20-installer-done') {
            $f = "shots\$n.png"
            if (-not (Test-Path $f)) { throw "missing $f" }
            if ((Get-Item $f).Length -lt 8000) { throw "$f is suspiciously small" }
          }

      - name: Render demo video
        shell: pwsh
        run: |
          $exe = "src\bin\Release\BeamNG.drive.exe"
          $p = Start-Process -FilePath $exe -ArgumentList '--video','video' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "video render failed with exit code $($p.ExitCode)" }
          $frames = (Get-ChildItem video\f_*.jpg).Count
          Write-Host "frames: $frames"
          if ($frames -lt 700) { throw "only $frames frames rendered" }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          ffmpeg -y -framerate 30 -i video\f_%05d.jpg -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p -movflags +faststart beamng-prank-demo.mp4
          if (-not (Test-Path beamng-prank-demo.mp4)) { throw "video was not produced" }
          $mb = [math]::Round((Get-Item beamng-prank-demo.mp4).Length / 1MB, 1)
          Write-Host "video: $mb MB"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-shots
          path: shots/
          retention-days: 7
          if-no-files-found: warn

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item src\bin\Release\BeamNG.drive.exe dist\
          Copy-Item src\bin\Release\*.config dist\ -ErrorAction SilentlyContinue
          Copy-Item src\Installer\bin\Release\BeamNG.drive_Setup.exe dist\
          Get-ChildItem dist | Select-Object Name,Length
          Compress-Archive -Path dist\* -DestinationPath BeamNG-drive-win.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: demo-video
          path: beamng-prank-demo.mp4
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: BeamNG-drive-win
          path: BeamNG-drive-win.zip
          retention-days: 30
          if-no-files-found: error
