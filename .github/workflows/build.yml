name: build-exe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild src\BeamPrank.csproj /restore /p:Configuration=Release /p:Platform=AnyCPU /v:minimal

      - name: Render screens (self-test)
        shell: pwsh
        run: |
          $exe = "src\bin\Release\BeamNG.drive.exe"
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest','shots' -Wait -PassThru -NoNewWindow
          Write-Host "self-test exit code: $($p.ExitCode)"
          if (Test-Path shots\_report.txt) { Get-Content shots\_report.txt }
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-shots
          path: shots/
          if-no-files-found: warn

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item src\bin\Release\BeamNG.drive.exe dist\
          Copy-Item src\bin\Release\*.config dist\ -ErrorAction SilentlyContinue
          Get-ChildItem dist | Select-Object Name,Length
          Compress-Archive -Path dist\* -DestinationPath BeamNG-drive-win.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: BeamNG-drive-win
          path: BeamNG-drive-win.zip
          if-no-files-found: error
